<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Reusable Outlined Snowflake Component -->
    <g id="outlined-snowflake">
      <!-- 1. Thick White Outline Base Layer -->
      <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round">
        <line x1="0" y1="-4" x2="0" y2="4" />
        <line x1="-4" y1="0" x2="4" y2="0" />
        <line x1="-2.8" y1="-2.8" x2="2.8" y2="2.8" />
        <line x1="-2.8" y1="2.8" x2="2.8" y2="-2.8" />
      </g>
      <!-- 2. Thin Ice-Blue Inner Core Layer -->
      <g stroke="#B3E5FC" stroke-width="1.5" stroke-linecap="round">
        <line x1="0" y1="-4" x2="0" y2="4" />
        <line x1="-4" y1="0" x2="4" y2="0" />
        <line x1="-2.8" y1="-2.8" x2="2.8" y2="2.8" />
        <line x1="-2.8" y1="2.8" x2="2.8" y2="-2.8" />
      </g>
    </g>
  </defs>

  <!-- THE CRESCENT MOON (Natively positioned top-left, no clipping) -->
  <path d="M28 13 A 9 9 0 1 1 17 24 A 7.5 7.5 0 0 0 28 13 z" 
        fill="#FFE082" 
        stroke="#FFFFFF" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- THE CLOUD (Center-Right Foreground Layer) -->
  <path d="M48 42H26a7 7 0 0 1-5.5-11.3a7 7 0 0 1 9.5-2.2a10 10 0 0 1 17.5-.5A6 6 0 0 1 48 42z"
        fill="#78909C"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linejoin="round" />

  <!-- PRECIPITATION GRID (Alternating Rain & Snow) -->
  <!-- Row 1: Left Tilted Raindrop -->
  <path d="M19 46 C19 46, 17 49, 17 50.5 A 1.5 1.5 0 0 0 20 50.5 C20 49, 19 46, 19 46 Z" 
        fill="#29B6F6" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Row 1: Middle Snowflake -->
  <use href="#outlined-snowflake" x="31" y="47" />

  <!-- Row 1: Right Tilted Raindrop -->
  <path d="M43 46 C43 46, 41 49, 41 50.5 A 1.5 1.5 0 0 0 44 50.5 C44 49, 43 46, 43 46 Z" 
        fill="#29B6F6" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" />
        
  <!-- Row 2: Lower Left Snowflake -->
  <use href="#outlined-snowflake" x="23" y="55" />

  <!-- Row 2: Lower Right Tilted Raindrop -->
  <path d="M35 52 C35 52, 33 55, 33 56.5 A 1.5 1.5 0 0 0 36 56.5 C36 55, 35 52, 35 52 Z" 
        fill="#29B6F6" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" />
</svg>
