<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Reusable Outlined Snowflake Component (Centered at 0,0) -->
    <g id="outlined-snowflake">
      <!-- 1. Thick White Outline Base Layer -->
      <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round">
        <line x1="0" y1="-4" x2="0" y2="4" />
        <line x1="-4" y1="0" x2="4" y2="0" />
        <line x1="-2.8" y1="-2.8" x2="2.8" y2="2.8" />
        <line x1="-2.8" y1="2.8" x2="2.8" y2="-2.8" />
      </g>
      <!-- 2. Thin Ice-Blue Inner Core Layer -->
      <g stroke="#B3E5FC" stroke-width="1.5" stroke-linecap="round">
        <line x1="0" y1="-4" x2="0" y2="4" />
        <line x1="-4" y1="0" x2="4" y2="0" />
        <line x1="-2.8" y1="-2.8" x2="2.8" y2="2.8" />
        <line x1="-2.8" y1="2.8" x2="2.8" y2="-2.8" />
      </g>
    </g>
  </defs>

  <!-- THE SUN (Top-Left Background Layer) -->
  <g>
    <!-- Sun Body -->
    <circle cx="22" cy="22" r="10" fill="#FFB300" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Comprehensive Sun Rays -->
    <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
      <line x1="22" y1="4" x2="22" y2="8" />
      <line x1="4" y1="22" x2="8" y2="22" />
      <line x1="9.3" y1="9.3" x2="12.1" y2="12.1" />
      <line x1="9.3" y1="34.7" x2="12.1" y2="31.9" />
      <line x1="34.7" y1="9.3" x2="31.9" y2="12.1" />
    </g>
  </g>

  <!-- THE CLOUD (Center-Right Foreground Layer) -->
  <path d="M48 42H26a7 7 0 0 1-5.5-11.3a7 7 0 0 1 9.5-2.2a10 10 0 0 1 17.5-.5A6 6 0 0 1 48 42z"
        fill="#78909C"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linejoin="round" />

  <!-- PURE SNOWFLAKE GRID (Staggered 3-Crystal Layout) -->
  <!-- Left Snowflake -->
  <use href="#outlined-snowflake" x="20" y="48" />

  <!-- Center Lower Snowflake -->
  <use href="#outlined-snowflake" x="32" y="55" />

  <!-- Right Snowflake -->
  <use href="#outlined-snowflake" x="44" y="48" />
</svg>
